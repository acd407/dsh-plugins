name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Unit tests only: the llm-capacity-retry integration test boots the
      # installed DeepSeek Harness, which CI does not have.
      - run: node --test packages/subagent-defaults/test/ packages/gpt-apply-patch/test/ packages/llm-capacity-retry/test/
